<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1120">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">

{%- comment -%}
  max-image-preview:large lets Google use the full-width share card in results;
  pages that opt out (the 404) set `noindex: true` in their front matter.
{%- endcomment -%}
{%- if page.noindex -%}
<meta name="robots" content="noindex, follow">
{%- else -%}
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
{%- endif -%}

{%- seo -%}
{%- feed_meta -%}
{%- include schema.html -%}

<link rel="sitemap" type="application/xml" title="Sitemap" href="{{ '/sitemap.xml' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<script>
  // Applied before first paint so the saved theme never flashes.
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t) {
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f8fc');
        }
      }
    } catch (e) {}
  })();
</script>
